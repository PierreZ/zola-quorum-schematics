<div class="statusbar">
  <div class="in">
    <span id="sb-dot">{{ config.extra.status_online | default(value="● online") }}</span>
    <span class="hide-sm">{{ config.extra.status_uptime | default(value="uptime: —") }}</span>
    <span class="spacer"></span>
    <span class="hide-sm">last deploy: {{ now() | date(format="%Y-%m-%d") }}</span>
    <span id="sb-read" class="hide-sm">read: quorum R=2</span>
    <span id="sb-nodes">nodes: 3/3 healthy</span>
  </div>
</div>
